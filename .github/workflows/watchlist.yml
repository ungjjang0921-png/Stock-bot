name: watchlist

on:
  schedule:
    - cron: "11,41 8-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: wl-${{ github.run_id }}
          restore-keys: wl-
      - run: pip install yfinance pandas numpy requests scikit-learn
      - run: python watchlist.py
        timeout-minutes: 25
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: wl-${{ github.run_id }}
      - name: publish
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update dashboard" && git pull --rebase -X theirs && git push)
