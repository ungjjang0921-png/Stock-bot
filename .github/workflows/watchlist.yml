name: watchlist

on:
  schedule:
    # GitHub 예약 실행은 붐비면 자주 건너뜀 → 15분마다 예약해서 실제로 30분 안팎마다 돌게
    - cron: "7,22,37,52 * * * 1-5"  # 평일 하루 종일 (한국시간 월 오전 9시 ~ 토 오전 9시)
    - cron: "7,22,37,52 0-1 * * 6"  # 금요일 애프터 마무리 (한국시간 토 오전 9~11시)
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # 끝나면 30분 뒤 다음 실행을 스스로 예약

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4  # 5년 일봉·프리장·SEC 데이터를 하루 동안 재사용
        with:
          path: .cache
          key: wl-${{ github.run_id }}
          restore-keys: wl-
      - run: pip install yfinance pandas numpy requests scikit-learn
      - run: python watchlist.py
        timeout-minutes: 48
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/cache/save@v4     # 실패·시간초과여도 받아둔 데이터는 저장
        if: always()
        with:
          path: .cache
          key: wl-${{ github.run_id }}
      - name: publish
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update dashboard" && git pull --rebase -X theirs && git push)
      # GitHub 예약 실행은 자주 건너뛰어서 → 미국 장 시간(프리·정규·애프터)엔 끝나고 30분 맞춰 스스로 다음 실행을 예약
      - name: next run in 30 min
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=America/New_York date +%-H); D=$(TZ=America/New_York date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 3 ] && [ "$H" -lt 20 ]; then
            WAIT=$(( 1800 - ( $(date +%s) - START ) ))
            if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
            N=$(gh run list -R "${{ github.repository }}" -w watchlist.yml -L 20 --json status -q '[.[] | select(.status != "completed")] | length')
            if [ "${N:-0}" -le 1 ]; then gh workflow run watchlist.yml -R "${{ github.repository }}" --ref main; fi
          fi
