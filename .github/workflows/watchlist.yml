name: watchlist

on:
  schedule:
    - cron: "11,41 8-20 * * 1-5"   # 30분마다 (한국시간 오후 5:11 ~ 새벽 5:41)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchlist

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4          # 5년 일봉·프리장·SEC 데이터를 하루 동안 재사용
        with:
          path: .cache
          key: wl-${{ github.run_id }}
          restore-keys: wl-
      - run: pip install yfinance pandas numpy requests
      - run: python watchlist.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: publish
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update dashboard" && git pull --rebase -X theirs && git push)
