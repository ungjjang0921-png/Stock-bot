name: fast

on:
  schedule:
    - cron: "*/10 8-20 * * 1-5"    # 10분마다 (한국시간 오후 5시 ~ 새벽 6시) — 프장·정규·애프터
    - cron: "*/10 0-7 * * 1-5"     # 10분마다 (한국시간 오전 9시 ~ 오후 5시)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fast.py
      - name: publish
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/live.json
          git diff --cached --quiet || (git commit -m "live" && git pull --rebase -X theirs && git push)
