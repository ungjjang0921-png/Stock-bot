name: stock-bot

on:
  schedule:
    - cron: "*/5 8-21 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        type: choice
        options: [test, scan, jongbae]
        default: test

permissions:
  contents: write

concurrency:
  group: stock-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance ta pandas requests pandas_market_calendars
      - run: python stock_alert_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_ONCE: "1"
          TASK: ${{ github.event.inputs.task || '' }}
      - name: save state
        if: always()
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X theirs && git push)
