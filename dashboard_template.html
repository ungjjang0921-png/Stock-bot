<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펌핑 목적 워치리스트</title>
<style>
:root{
  --bg:#0b1118;--panel:#111a24;--panel2:#162231;--line:#22324a;--text:#e6edf5;--muted:#8a9bb0;
  --accent:#5ec8ff;--good:#3ddc97;--warn:#f5b84a;--bad:#ff6b6b;--violet:#b49cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,17,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
h1{font-size:17px;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.controls{display:flex;gap:8px;margin-top:10px}
input,select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:14px}
select{flex:0 0 auto;max-width:46%}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cz{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.cz span{text-align:center;padding:7px 0;border-radius:10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.cz span small{display:block;font-size:10.5px;opacity:.7}.cz span.on{background:var(--panel2);color:var(--text);font-weight:800}
.ce{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;scrollbar-width:none}.ce::-webkit-scrollbar{display:none}
.ce span{white-space:nowrap;padding:6px 11px;border-radius:16px;background:var(--panel);font-size:12px;cursor:pointer;border:1px solid var(--line)}
.ce span.on{background:#3a1d24;color:#ff7b8a;border-color:#5a2b33}
.cc{border-bottom:1px solid var(--line);padding:12px 2px}
.cc .t1{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start}
.cc .rk{font-weight:800;color:var(--muted);padding-top:2px}.cc .tk{font-weight:800;font-size:15.5px}.cc .nm{font-size:11.5px;color:var(--muted)}
.cc .up2{text-align:right;font-weight:800;font-size:17px;color:#ff5d6c}.cc .up2 small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.cc .en{font-size:12.5px;margin:6px 0 4px 30px;color:var(--muted)}.cc .en b{color:var(--text)}
.cc .eh{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:4px 0 4px 30px}
.dots i{display:inline-block;width:7px;height:11px;border-radius:2px;background:#3a3f4a;margin-left:2px}.dots i.f{background:#ff5d6c}
.eg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-left:30px}
.eg div{border-radius:10px;text-align:center;padding:6px 0;font-size:10.5px;background:#161a22;color:#4b5563;border:1px solid transparent}
.eg div b{display:block;font-size:14px}
.eg .r1{background:#e5484d;color:#fff}.eg .r2{background:#3a1d24;color:#ff7b8a;border-color:#7a2b35}.eg .r3{background:var(--panel2);color:var(--text);border-color:var(--line)}
.cd{margin:8px 0 0 30px;display:none}.cc.open .cd{display:block}
.cd .eb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px;line-height:1.6}
.cd .eb h5{margin:0 0 4px;font-size:12.5px;display:flex;justify-content:space-between}
.cst{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.7;margin-bottom:8px}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.cal .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal .ch span{padding:2px 14px;font-size:20px;cursor:pointer;color:var(--accent)}.cal .ch b{font-size:14px}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .cg em{font-style:normal;font-size:10.5px;color:var(--muted)}
.cal .cg span{border-radius:8px;padding:5px 0 3px;min-height:38px}
.cal .cg span b{display:block;font-size:12.5px;font-weight:600}.cal .cg span i{display:block;font-style:normal;font-size:9.5px;color:var(--muted)}
.cal .cg .no b{color:#4b5563;font-weight:400}
.cal .cg .has{background:var(--panel2);cursor:pointer;box-shadow:inset 0 -2px 0 var(--accent)}
.cal .cg .has.on{background:var(--accent);color:#04121c}.cal .cg .has.on i{color:#04121c}
.rvb{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 36px;gap:8px;align-items:center;font-size:11.5px;padding:3px 0}
.rvb i{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.rvb i b{display:block;height:100%;background:var(--bad)}
.rvb em{font-style:normal;color:var(--muted);text-align:right}
.rvp{font-size:11.5px;color:var(--muted);margin-top:6px}.rvp b{font-family:var(--mono)}
.rvw{margin:6px 0 0;padding-left:16px;font-size:12px;line-height:1.6}
.hot{background:var(--panel);border:1px solid #5a2b33;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.sqc.fire{border-color:#5a2b33}.sqc.warm{border-color:#5a4a2b}
.hot .hh{font-weight:800;font-size:13.5px;margin-bottom:4px}.hot .hh small{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:4px}
.hot .hr{display:grid;grid-template-columns:minmax(58px,max-content) 1fr auto 62px;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px;cursor:pointer}
.hot .hr b{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.hot .hr span{color:var(--muted);font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hot .hr em{font-style:normal;font-family:var(--mono)}.hot .hr i{font-style:normal;font-family:var(--mono);text-align:right;font-weight:700}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:#0f2433}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:12px;cursor:pointer;align-items:start}
.rank{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:700}
.rank.r1{background:#d98e2b;color:#111}.rank.r2{background:#9aa7b5;color:#111}.rank.r3{background:#b6763f;color:#111}
.tk{font-weight:800;font-size:16px;letter-spacing:.3px}
.nm{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.px{font-family:var(--mono);font-size:13px;margin-top:2px}
.up{color:var(--good)}.dn{color:var(--bad)}
.score{text-align:right}
.score b{font-size:22px;font-family:var(--mono);color:var(--good)}
.score small{display:block;color:var(--muted);font-size:11px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 12px 8px;font-size:12px;color:var(--muted)}
.meta span b{color:var(--text);font-weight:600}
.bars{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:4px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i.on{background:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.tag{font-size:11.5px;border-radius:6px;padding:3px 7px;background:var(--panel2);border:1px solid var(--line)}
.tag em{font-style:normal;opacity:.75;margin-left:4px;font-size:10.5px}
.t-red{border-color:#5a2b33;background:#2a1519;color:#ffb3b3}
.t-org{border-color:#5a4520;background:#2a2112;color:#ffd38a}
.t-vio{border-color:#3e3566;background:#1d1a33;color:#cdbfff}
.t-grn{border-color:#1f4a3a;background:#10261e;color:#9ff0c9}
.plan{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.plan div{padding:8px 10px;border-right:1px solid var(--line)}
.plan div:last-child{border-right:0}
.plan small{display:block;color:var(--muted);font-size:10.5px}
.plan b{font-family:var(--mono);font-size:13px}
.detail{display:none;border-top:1px solid var(--line);background:#0e1620;padding:12px;font-size:12.5px}
.card.open .detail{display:block}
.sec{margin-bottom:12px}
.sec h3{font-size:12px;color:var(--accent);margin:0 0 6px;font-weight:700}
.dp{margin:0 12px 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1520}
.dp>h4{margin:0;padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dp>h4 small{font-weight:400;color:var(--muted);font-size:10.5px}
.dp .bz{padding:8px 12px;font-size:12.5px;line-height:1.55;border-bottom:1px dashed var(--line)}
.dp .ds{padding:10px 12px;border-bottom:1px solid var(--line)}
.dp .ds:last-child{border-bottom:0}
.dp .dt{font-weight:800;font-size:12.5px;margin-bottom:6px;border-left:3px solid var(--bad);padding-left:7px}
.dp .dt small{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:4px}
.ld{display:grid;grid-template-columns:auto 44px 1fr;gap:6px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12px}
.ld b{font-family:var(--mono);font-size:13px}.ld i{font-style:normal;font-size:10.5px;color:var(--muted);text-align:right}
.ld.vio{background:rgba(180,156,255,.12)}.ld.vio b{color:var(--violet)}
.ld.red b{color:var(--bad)}.ld.org b{color:var(--warn)}.ld.grn b{color:var(--good)}
.ld.now{background:rgba(94,200,255,.13)}.ld.now b{color:var(--accent)}
.chp{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.chp.r{color:var(--bad)}.chp.o{color:var(--warn)}.chp.g{color:var(--good)}
.pmL{margin-top:8px;font-size:11.5px;line-height:1.6}.pmL .p{color:var(--good)}.pmL .m{color:var(--bad)}
.bby{margin-top:8px;padding:6px 8px;border-radius:8px;background:rgba(245,184,74,.12);border:1px solid rgba(245,184,74,.35);font-size:11.5px}
.dsum{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:6px}.dsum b{color:var(--text);font-family:var(--mono)}
.irow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-top:1px dashed var(--line);font-size:12px}
.irow .k{font-weight:700}.irow .k small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.irow .q{text-align:right;font-family:var(--mono)}.irow .q small{display:block;color:var(--muted);font-size:10.5px;font-family:inherit}
.irow .n{grid-column:1/-1;color:var(--muted);font-size:10.5px}
.brk{margin-top:8px;padding:8px;border-radius:8px;background:var(--panel2);font-size:11.5px;line-height:1.6}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}.kv2 dt{color:var(--muted)}.kv2 dd{margin:0}
.ev{display:grid;grid-template-columns:86px 44px 1fr;gap:6px;padding:5px 0;border-top:1px dashed var(--line);font-size:12px;align-items:center}
.ev .d{font-family:var(--mono);font-size:11.5px}.ev .dd{font-size:10.5px;color:var(--warn);font-weight:700}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-top:1px dashed var(--line);font-size:12px}
.hrow small{color:var(--muted);font-size:10.5px}.hrow .a{text-align:right;font-weight:700}
.hrow .a.s{color:var(--bad)}.hrow .a.b{color:var(--good)}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.ck span:before{content:"✕ ";color:var(--bad)}
.ck span.ok:before{content:"✓ ";color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono)}
.fl{list-style:none;margin:0;padding:0}
.fl li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.fl li span:first-child{font-family:var(--mono);color:var(--muted);flex:0 0 78px}
.fl a{color:var(--text);text-decoration:none}
.fl a b{color:var(--violet);font-weight:600;margin-right:4px}
.ai{background:#1a1830;border:1px solid #3e3566;border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.65;font-size:13px}
.note{color:var(--muted);font-size:11px;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.dday{color:var(--warn);font-family:var(--mono)}
.sigs{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.sg{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px}
.sg.red{background:#3a1519;color:#ff8f8f}.sg.org{background:#3a2a10;color:#ffc062}
.sg.grn{background:#10301f;color:#6be3a4}.sg.vio{background:#251f45;color:#c5b3ff}
.watch{color:var(--warn);font-size:13px;margin-left:4px}
.chartbox{background:#0a1018;border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px}
.chartbox h4{margin:0 0 6px;font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-bottom:6px}
.lg span:before{content:"";display:inline-block;width:14px;height:0;margin-right:4px;vertical-align:middle;border-top:2px solid var(--accent)}
.lg .l2:before{border-top:2px dashed #8a9bb0}.lg .l3:before{border-top:2px dotted #ff8a5c}
.spk{width:100%;height:auto;display:block}
.spk .ln{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spk .area{fill:rgba(94,200,255,.08)}
.spk .prev{stroke:#8a9bb0;stroke-dasharray:5 4;stroke-width:1}
.spk .open{stroke:#ff8a5c;stroke-dasharray:2 3;stroke-width:1.2}
.spk .dot{fill:var(--accent)}
.spk text{fill:var(--muted);font-size:9px;font-family:var(--mono)}
.spx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mgrid div{background:#0a1018;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mgrid small{display:block;color:var(--muted);font-size:11px}
.mgrid b{display:block;font-family:var(--mono);font-size:18px;margin:2px 0}
.mgrid em{font-style:normal;font-size:11px;color:var(--muted)}
.rng{margin-top:12px}
.rng h5{margin:0 0 6px;font-size:12px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.bar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);box-shadow:0 0 0 2px #0e1620}
.bar i.lo{background:var(--bad)}
.bar u{position:absolute;top:-4px;width:2px;height:14px;background:var(--muted);transform:translateX(-50%)}
.rl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;gap:6px}
.rl span:nth-child(2){text-align:center}.rl span:last-child{text-align:right}
.slist{margin-top:10px}
.slist div{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.slist div:last-child{border-bottom:0}
.slist .sg{flex:0 0 auto}
.prob{margin:0 12px 10px;border:1px solid var(--line);border-radius:12px;background:#0d1622;padding:8px 10px}
.prob h6{margin:0 0 6px;font-size:11.5px;color:var(--muted);font-weight:600}
.prob .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prob small{display:block;font-size:11px;color:var(--muted)}
.prob b{font-family:var(--mono);font-size:20px}
.prob .pb{height:5px;border-radius:3px;background:var(--panel2);margin:4px 0 3px;overflow:hidden}
.prob .pb i{display:block;height:100%;border-radius:3px;background:var(--good)}
.prob em{font-style:normal;font-size:10.5px;color:var(--muted)}
.prob .act{display:inline-block;margin-top:2px;font-size:11px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.tab{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 2px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--accent);color:var(--text);background:#0f2433}
.hide{display:none!important}
.cand{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 12px 8px}
.ch .rank{width:28px;height:28px}
.ty{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:3px;background:#1d2a3d;color:var(--accent)}
.cs{text-align:right}.cs b{font-family:var(--mono);font-size:22px;color:var(--warn)}.cs small{display:block;color:var(--muted);font-size:10.5px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 10px}
.kp div{background:#0d1622;border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.kp small{display:block;color:var(--muted);font-size:10.5px;line-height:1.3}
.kp b{font-family:var(--mono);font-size:17px}
.kp em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.chipsm{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.chipsm span{font-size:11px;border-radius:6px;padding:2px 7px;background:#10301f;color:#6be3a4}
.chipsm span.rk{background:#3a1519;color:#ff8f8f}
.scn{padding:0 12px 10px}
.scn div{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.5}
.scn b{font-size:11.5px;border-radius:6px;padding:2px 0;text-align:center;height:fit-content}
.tp{margin:0 12px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.tp h4{margin:0 0 8px;font-size:13px}
.tp .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.tp .g div{background:rgba(127,127,127,.08);border-radius:8px;padding:6px 8px}
.tp .g small{display:block;opacity:.7;font-size:11px}
.tp .g b{font-size:13.5px}
.tp .g em{display:block;font-style:normal;font-size:10.5px;opacity:.65}
.tp .vd{padding:6px 8px;border-radius:8px;font-weight:600}
.tp .vd.good{background:rgba(34,197,94,.14);color:#22c55e}
.tp .vd.mid{background:rgba(245,158,11,.14);color:#f59e0b}
.tp .vd.bad{background:rgba(239,68,68,.14);color:#ef4444}
.tp .ft{opacity:.65;font-size:11px;margin-top:6px}
.s-근거,.s-매수,.s-익일{background:#1d2a3d;color:var(--accent)}.s-강세{background:#10301f;color:#6be3a4}
.s-기본{background:#22262e;color:#c9d3df}.s-약세{background:#3a1519;color:#ff8f8f}.s-리스크{background:#3a2a10;color:#ffc062}
.nws{padding:0 12px 12px;font-size:12px}
.nws a{display:block;color:var(--text);text-decoration:none;padding:5px 0;border-top:1px solid var(--line)}
.nws a i{font-style:normal;font-weight:700;margin-right:5px}
.nws .s-호재{color:var(--good)}.nws .s-악재{color:var(--bad)}.nws .s-중립{color:var(--muted)}
.nws small{display:block;color:var(--muted);font-size:10.5px}
.go{display:block;text-align:center;padding:9px;border-top:1px solid var(--line);color:var(--accent);font-size:12.5px;text-decoration:none}
.intro{color:var(--muted);font-size:12px;line-height:1.55;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1622}
.cday{margin:14px 0 6px;font-size:13px;font-weight:800;display:flex;justify-content:space-between}
.cday span{color:var(--warn);font-family:var(--mono)}
.crow{display:grid;grid-template-columns:62px 1fr;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.crow b{font-size:14px}.crow small{display:block;color:var(--muted);font-size:11px}
.crow em{font-style:normal;font-weight:700;font-size:12.5px}
.sc{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
.sc th,.sc td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.sc th{color:var(--muted);font-weight:600;font-family:inherit}
.sc td:first-child,.sc th:first-child{text-align:left;font-family:inherit}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.side{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-right:5px}
.side.악재{background:#3a1519;color:#ff8f8f}.side.주의{background:#3a2a10;color:#ffc062}
.side.호재{background:#10301f;color:#6be3a4}.side.중립{background:#22262e;color:#c9d3df}
.frow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.frow .ft{font-weight:800;font-size:14px;cursor:pointer}.frow .ft small{font-weight:400;color:var(--muted);font-size:11px;margin-left:5px}
.frow .fl{grid-column:1/3;font-size:12.5px}.frow .fm{font-size:11px;color:var(--muted);text-align:right}
.frow a{color:var(--accent);font-size:11.5px;text-decoration:none}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg span{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:12px;color:var(--muted);cursor:pointer}
.seg span.on{border-color:var(--accent);color:var(--text)}
.drow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.drow .dh{display:flex;justify-content:space-between;align-items:center}
.drow .dh b{font-size:15px}.risk{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px}
.risk.높음{background:#3a1519;color:#ff8f8f}.risk.중간{background:#3a2a10;color:#ffc062}.risk.낮음{background:#22262e;color:#c9d3df}
.drow .dg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:11px;color:var(--muted)}
.drow .dg b{display:block;font-family:var(--mono);font-size:14px;color:var(--text)}
.rep{display:block;text-align:center;margin:0 0 12px;padding:10px;border-radius:10px;background:#0f2433;border:1px solid var(--accent);color:var(--accent);font-weight:700;text-decoration:none}
.aiv{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:8px 10px;border-radius:10px;border:1px solid #3e3566;background:#1a1830;font-size:12.5px}
.aiv b{font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.aiv .s-긍정{background:#10301f;color:#6be3a4}.aiv .s-중립{background:#22262e;color:#c9d3df}.aiv .s-부정{background:#3a1519;color:#ff8f8f}
.aiv i{font-style:normal;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.hz{display:flex;gap:6px;margin:0 0 10px}.hz span{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:12.5px;color:var(--muted);cursor:pointer}
.hz span.on{border-color:var(--accent);color:var(--text);background:#0f2433}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cmp>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.cmp>div.nw{border-color:var(--accent)}
.cmp h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}.cmp .r{font-family:var(--mono);font-size:24px;font-weight:800}
.cmp small{display:block;color:var(--muted);font-size:11px;line-height:1.5}.cmp b{color:var(--text)}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pc .h{display:flex;justify-content:space-between;align-items:baseline}.pc .h b{font-size:15px}
.pc .h small{color:var(--muted);font-size:11px;margin-left:6px}
.pc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:11px;color:var(--muted)}
.pc .g b{display:block;font-family:var(--mono);font-size:13.5px;color:var(--text)}
.pc .wy{margin-top:6px;font-size:11.5px;color:var(--muted)}
.pc .tp{margin:10px 0 0}
.pc .pmx{display:none;margin-top:10px}.pc.open .pmx{display:block}
.pc .pmx .tags{padding:0 0 10px}.pc .pmx .aiv,.pc .pmx .prob{margin-left:0;margin-right:0}
.pc .pmt{margin-top:8px;text-align:center;font-size:12px;color:var(--muted);padding:6px;border-top:1px dashed var(--line);cursor:pointer}
.rs{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
.rs.적중{background:#10301f;color:#6be3a4}.rs.미적중{background:#3a1519;color:#ff8f8f}.rs.관찰{background:#22262e;color:#c9d3df}
</style>
</head>
<body>
<header>
  <h1>🎯 펌핑 목적 워치리스트</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs"><span class="tab on" data-v="all">📋 워치</span><span class="tab" data-v="surge">🚀 급등</span><span class="tab" data-v="jb">🎯 종배</span><span class="tab" data-v="catch">📡 포착</span><span class="tab" data-v="pred">🔮 예측</span><span class="tab" data-v="cal">📅 일정</span><span class="tab" data-v="sq">🩳 숏스퀴즈</span></div>
  <div class="controls" id="ctl">
    <input id="q" placeholder="티커·회사명 검색" autocomplete="off">
    <select id="sort">
      <option value="total">통합점수순</option>
      <option value="chg">오늘 등락률순 (급등주 먼저)</option>
      <option value="strength">부양 강도순</option>
      <option value="stage">차트 단계순</option>
      <option value="runway">런웨이 짧은순</option>
      <option value="dday">기한 임박순</option>
      <option value="upside">상승 여력순</option>
      <option value="rsi">RSI 낮은순</option>
      <option value="relvol">오늘 거래량 급증순</option>
      <option value="ai">AI 관점 점수순</option>
      <option value="regp">본장 급등확률순</option>
      <option value="prep">프리장 급등확률순</option>
      <option value="chg">오늘 등락률순</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<script>
const DATA = /*__DATA__*/null;
const FILTERS = ["⭐관심","🔥오늘 급등","과매도","신저가","장중 반등","거래량 폭증","VWAP 위","상장 유지","현금 조달","물량 출회","병합","매집 의심","소형 유통","공모 준비","ATM·공모","공시 지연"];
const keysOf = it => (it.snap && it.snap.keys) || [];
const matches = (it, f) => f === "⭐관심" ? it.watch : f === "🔥오늘 급등" ? ((it.snap && it.snap.chg) || it.chg || 0) >= 20 : (it.tags.some(t => t.name === f) || keysOf(it).includes(f));
const TK = t => esc(t);
const pfmt = v => v == null ? "-" : (v < 1 ? v.toFixed(4) : v.toFixed(2));
function spark(s, sn){
  if (!s || !s.p || s.p.length < 3) return '<div class="note">장중 1분봉 데이터 없음 (장 시작 전이거나 거래 없음)</div>';
  const W = 320, H = 130, L = 2, R = 44, T = 6, B = 6;
  const refs = [sn.prev, sn.open].filter(v => v != null);
  const lo = Math.min(...s.p, ...refs), hi = Math.max(...s.p, ...refs), rg = (hi - lo) || hi * 0.01 || 1;
  const x = i => L + (W - L - R) * i / (s.p.length - 1), y = v => T + (H - T - B) * (1 - (v - lo) / rg);
  const pts = s.p.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  const hl = (v, c) => v == null ? "" : `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="${c}"/>`;
  const ticks = [hi, (hi + lo) / 2, lo].map(v => `<text x="${W - R + 4}" y="${(y(v) + 3).toFixed(1)}">${pfmt(v)}</text>`).join("");
  const last = s.p[s.p.length - 1];
  return `<div class="lg"><span class="l1">가격</span>${sn.prev != null ? `<span class="l2">전일 종가 ${pfmt(sn.prev)}</span>` : ""}${sn.open != null ? `<span class="l3">시가 ${pfmt(sn.open)}</span>` : ""}</div>
    <svg viewBox="0 0 ${W} ${H}" class="spk" role="img" aria-label="1분봉 가격 추이">
      <polygon points="${L},${H - B} ${pts} ${x(s.p.length - 1).toFixed(1)},${H - B}" class="area"/>
      ${hl(sn.prev, "prev")}${hl(sn.open, "open")}
      <polyline points="${pts}" class="ln"/>
      <circle cx="${x(s.p.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="3.5" class="dot"/>${ticks}
    </svg><div class="spx" style="margin-right:${(R / W * 100).toFixed(0)}%"><span>${s.t0}</span><span>${s.tm}</span><span>${s.t1}</span></div>`;
}
function rangeBar(title, lo, hi, cur, mark, lbl){
  if (lo == null || hi == null || cur == null || hi <= lo) return "";
  const pc = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const p = pc(cur);
  return `<div class="rng"><h5>${title}</h5><div class="bar">${mark != null ? `<u style="left:${pc(mark)}%"></u>` : ""}<i class="${p < 8 ? 'lo' : ''}" style="left:${p}%"></i></div>
    <div class="rl"><span>${lbl[0]} ${pfmt(lo)}</span><span>${lbl[1].replace("{p}", p.toFixed(0))}</span><span>${lbl[2]} ${pfmt(hi)}</span></div></div>`;
}
function probBlock(it){
  const p = it.prob;
  if (!p || (p.reg == null && p.pre == null)) return "";
  const one = (icon, label, v, base, n, th, act) => {
    if (v == null) return `<div><small>${icon} ${label}</small><b>-</b><em>데이터 없음</em></div>`;
    const lift = base ? (v / base) : null;
    const col = lift == null ? "" : lift >= 2 ? "up" : lift < 1 ? "dn" : "";
    const actTxt = act == null ? "" : `<span class="act ${act >= th ? 'up' : 'dn'}">실제 ${act >= 0 ? '+' : ''}${act}% ${act >= th ? '✅ 달성' : '❌ 미달'}</span>`;
    return `<div><small>${icon} ${label} +${th}% 터치</small><b class="${col}">${v.toFixed(1)}%</b>
      <div class="pb"><i style="width:${Math.min(100, v * 2)}%"></i></div>
      <em>평균 ${base ?? "-"}%${lift ? " · " + lift.toFixed(1) + "배" : ""} · 유사 ${n.toLocaleString()}일</em>${actTxt}</div>`;
  };
  return `<div class="prob"><h6>📅 ${esc(p.date)} 급등 확률 · ${esc(p.basis)}</h6><div class="pg">
    ${one("🌅", "프리장", p.pre, p.pre_base, p.n_pre, p.pre_th, p.pre_act)}
    ${one("🔔", "본장", p.reg, p.reg_base, p.n_reg, p.reg_th, p.reg_act)}</div></div>`;
}
function snapBlock(it){
  const sn = it.snap || {}, s = sn.spark;
  const chg = sn.chg == null ? "" : `<em class="${sn.chg >= 0 ? 'up' : 'dn'}">${sn.prev != null ? (sn.price - sn.prev >= 0 ? '+' : '') + pfmt(sn.price - sn.prev) + ' ' : ''}(${sn.chg >= 0 ? '+' : ''}${sn.chg.toFixed(2)}%)</em>`;
  const rsiCls = sn.rsi == null ? "" : sn.rsi <= 30 ? "dn" : sn.rsi >= 75 ? "up" : "";
  const big = v => v == null ? "-" : v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : (v / 1e3).toFixed(1) + "K";
  const fromHi = sn.hi52 ? ((sn.price / sn.hi52 - 1) * 100).toFixed(2) : null;
  return `<div class="sec"><div class="chartbox"><h4>${s ? esc(s.date) + "일 " : ""}1분봉 추이 <span class="note">(업데이트 시점 기준)</span></h4>${spark(s, sn)}</div>
    <div class="mgrid">
      <div><small>현재가</small><b>${pfmt(sn.price)}</b>${chg}</div>
      <div><small>RSI${sn.rsi_src ? " (" + esc(sn.rsi_src) + ")" : ""}</small><b class="${rsiCls}">${sn.rsi == null ? "-" : sn.rsi.toFixed(2)}</b><em>과매도 기준 30 미만</em></div>
      <div><small>거래 회전율</small><b>${sn.turnover == null ? "-" : sn.turnover.toFixed(1) + "배"}</b><em>거래량 ${big(sn.vol_day)}${sn.shares ? ", 유통 " + big(sn.shares) : ""}</em></div>
      <div><small>호가 스프레드</small><b>${sn.spread == null ? "-" : sn.spread.toFixed(2) + "%"}</b><em>${sn.bid != null ? pfmt(sn.bid) + " 매수, " + pfmt(sn.ask) + " 매도" : "호가 정보 없음"}</em></div>
    </div>
    ${rangeBar("당일 범위 내 위치", sn.day_lo, sn.day_hi, sn.price, sn.open, ["저가", "현재 {p}% 지점" + (sn.open != null ? ", 시가 " + pfmt(sn.open) : ""), "고가"])}
    ${rangeBar("52주 범위 내 위치", sn.lo52, sn.hi52, sn.price, null, ["52주 저가", fromHi != null ? "고점 대비 " + fromHi + "%" : "", "52주 고가"])}
    ${(sn.signals || []).length ? `<div class="slist"><h3 style="font-size:12px;color:var(--accent);margin:12px 0 2px">신호 요약</h3>${sn.signals.map(g => `<div><span class="sg ${g.lv}">${esc(g.k)}</span><span>${esc(g.t)}</span></div>`).join("")}</div>` : ""}
  </div>`;
}
const RED = ["급함","필요","기한형","위험"], ORG = ["가능","예정","진행","활성","안건 가능"];
const CK = {ma20:"20일선 이격 0~15%",lows:"최근 저점 상승",upvol:"상승일 거래량 우위",liq:"거래대금 충족",cool:"과열 아님"};
let on = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = v => v == null ? "-" : (v < 1 ? "$" + v.toFixed(4) : "$" + v.toFixed(2));
const big = v => v == null ? "-" : (Math.abs(v) >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : "$" + (v / 1e3).toFixed(0) + "K");
const rwTxt = r => r == null ? "미확인" : r >= 99 ? "흑자" : r.toFixed(1) + "개월";
const nearest = it => (it.ddays && it.ddays.length) ? it.ddays[0] : null;
const upside = it => it.target ? (it.target / it.price - 1) * 100 : -1;

function tagCls(t){
  if (t.name === "매집 의심" || t.name === "소형 유통") return "t-vio";
  if (RED.includes(t.level)) return "t-red";
  if (ORG.includes(t.level)) return "t-org";
  return "t-grn";
}
function bars(n){ return '<span class="bars">' + [6,8,10,12,14].map((h,i)=>`<i style="height:${h}px" class="${i<n?'on':''}"></i>`).join("") + "</span>"; }

function card(it, i){
  const d = nearest(it), up = upside(it), s = it.similar || {};
  const chg = it.chg == null ? "" : `<span class="${it.chg>=0?'up':'dn'}">${it.chg>=0?'+':''}${it.chg.toFixed(1)}%</span>`;
  const tags = it.tags.map(t => `<span class="tag ${tagCls(t)}">${esc(t.name)}<em>${esc(t.level)}</em></span>`).join("");
  const sigs = ((it.snap && it.snap.signals) || []).map(g => `<span class="sg ${g.lv}">${esc(g.k)}</span>`).join("");
  const checks = Object.entries(CK).map(([k,v]) => `<span class="${it.checks && it.checks[k]?'ok':''}">${v}</span>`).join("");
  const fl = (it.filings||[]).map(f => `<li><span>${esc(f.date)}</span><a href="${esc(f.url)}" target="_blank" rel="noopener"><b>${esc(f.form)}${f.items && f.form==='8-K'?' '+esc(f.items.split(',').filter(x=>x!=='9.01').join(',')):''}</b>${esc(f.ko)}</a></li>`).join("") || '<li><span>-</span>공시 없음 (해외기업이거나 미등록)</li>';
  const dd = (it.ddays||[]).map(x => `<dt>${esc(x.label)}</dt><dd>${esc(x.date)} <span class="dday">D${x.d>=0?'-':'+'}${Math.abs(x.d)}</span></dd>`).join("");
  return `<article class="card" id="c-${esc(it.t)}">
    <div class="top" onclick="this.parentNode.classList.toggle('open')">
      <div class="rank ${i<3?'r'+(i+1):''}">${i+1}</div>
      <div><div class="tk">${TK(it.t)}${it.watch ? '<span class="watch">⭐</span>' : ''}</div><div class="nm">${esc(it.name)}</div><div class="px">${usd(it.price)} ${chg}</div></div>
      <div class="score"><b>${it.total.toFixed(0)}</b><small>통합점수</small></div>
    </div>
    <div class="meta">
      <span>${bars(it.strength)}강도 <b>${it.strength}/5</b></span>
      <span>차트 <b>${it.stage}/5</b> ${esc(it.stage_name)}</span>
      <span>런웨이 <b>${rwTxt(it.runway)}</b></span>
      ${d ? `<span>${esc(d.label)} <b class="dday">D${d.d>=0?'-':'+'}${Math.abs(d.d)}</b></span>` : ""}
      ${it.float ? `<span>유통 <b>${(it.float/1e6).toFixed(1)}M</b></span>` : ""}
    </div>
    ${sigs ? `<div class="sigs">${sigs}</div>` : ""}
    <div class="tags">${tags || '<span class="tag">뚜렷한 동기 없음</span>'}</div>
    ${aiBadge(it)}
    ${probBlock(it)}
    ${tradeBlock(it)}${it.deep ? `<div style="margin:-4px 12px 10px;font-size:11.5px;color:var(--violet)">🔬 심층 분석(진입 판단·희석 물량·현금 조달·보유자) — 카드를 누르면 펼쳐져요</div>` : ""}
    <div class="plan">
      <div><small>참고 진입가</small><b>${usd(it.price)}</b></div>
      <div><small>유사군 예상 고점</small><b class="up">${it.target ? usd(it.target) : "-"}</b>${up>0?`<small>+${up.toFixed(0)}% · ${s.median.toFixed(2)}배</small>`:""}</div>
      <div><small>손절 참고</small><b class="dn">${usd(it.stop)}</b></div>
    </div>
    <div class="detail">
      ${it.ai ? `<div class="sec"><h3>🧠 AI 관점·종합 판단</h3><div class="ai">${esc(it.ai)}</div></div>` : ""}
      ${deepBlock(it) ? `<div style="margin:0 -12px">${deepBlock(it)}</div>` : ""}
      ${snapBlock(it)}

    return;
  }
  if (TAB === "catch"){
    const C = DATA.catch || {}, HZ = C.hz || {};
    window.CH = window.CH || "1"; window.CE = window.CE || "all"; window.CS = window.CS || "n";
    const lab = {"0": "오늘", "1": "1거래일", "5": "5거래일", "10": "10거래일"};
    const Z = HZ[CH] || {list: [], counts: {}};
    $("#sub").textContent = `${DATA.updated} 업데이트 · ${C.sess || ""} ${C.at ? "(" + C.at + ")" : ""}`;
    let h = `<div class="intro">📡 <b>포착</b> — 5개 엔진이 각자 상위 20개를 고르고, <b>여러 엔진이 같이 잡은 종목</b>을 위로 올려요 (많이 포착된 순 → 평균 순위). 카드를 누르면 엔진별 근거가 나와요.<br><span style="color:var(--muted)">칸 색: 진한 빨강 1~3위 · 빨간 테두리 4~10위 · 회색 11~20위. 🎯 = 3개 이상 엔진이 겹치고 경고 없음</span></div>
      <div class="cz">${["0","1","5","10"].map(k => `<span class="${CH === k ? "on" : ""}" onclick="CH='${k}';render()">${lab[k]}<small>${(HZ[k] || {list: []}).list.length}</small></span>`).join("")}</div>`;
    const S = (C.stat || {})[CH];
    if (S && S.all && S.all.n) {
      const r = x => x && x.n ? `<b>${x.r}%</b> <small>(${x.k}/${x.n})</small>` : "-";
      h += `<div class="cst">📊 최근 ${S.days}거래일 실제 성적 — ${CH === "0" ? "포착 때 가격 대비 당일 고가" : "종가 대비 다음날 고가"} +${S.th}% 이상 적중률<br>
        전체 ${r(S.all)} · 엔진 1개 ${r(S.by_n["1"])} · 2개 ${r(S.by_n["2"])} · <b>3개 이상 ${r(S.by_n["3"])}</b> · 🎯 ${r(S.focus)}<br>
        <span style="color:var(--muted)">엔진별(10위 안): ${EN.map(([k, , n]) => `${n} ${S.eng[k] && S.eng[k].n ? S.eng[k].r + "%" : "-"}`).join(" · ")}</span></div>`;
    } else if (CH === "0" || CH === "1") h += `<div class="cst" style="color:var(--muted)">📊 ${CH === "0" ? "오늘 탭은 정규장 시작 15분 뒤" : "1거래일 탭은 장 마감 뒤"} 목록을 고정해서 다음 날 실제 결과로 엔진별 적중률을 매겨요. 며칠 쌓이면 여기에 성적이 나와요.</div>`;
    if (CH === "0") h += `<div class="cst" style="color:var(--muted)">오늘 탭은 RabbitStock처럼 <b style="color:var(--text)">장중 엔진(프리뷰)만</b> 순위를 매겨요. 오늘 +3% 이상 오르고 VWAP 위에 있는 종목 중, 비슷한 장중 상황에서 +20%(프리장 +10%)를 친 비율·당일 상승·거래량으로 줄 세워요. 미국 정규장이 열린 뒤(한국 밤 11시 반) 갱신 때 제대로 채워져요.</div>`;
    if (CH === "0" && !C.live) h += `<div class="cst" style="color:var(--muted)">지금은 미국 장이 닫혀 있어서 오늘 탭은 마지막 장중 기준이에요. 프리장(한국 오후 6시)부터 다시 채워져요.</div>`;
    h += `<div class="ce"><span class="${CE === "all" ? "on" : ""}" onclick="CE='all';render()">모든 엔진</span>${EN.map(([k, ic, n]) => `<span class="${CE === k ? "on" : ""}" onclick="CE='${k}';render()">${ic} ${n} ${Z.counts[k] != null ? Z.counts[k] : "-"}</span>`).join("")}</div>
      <div style="text-align:right;margin-bottom:4px"><select onchange="CS=this.value;render()" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px">
        <option value="n" ${CS === "n" ? "selected" : ""}>많이 포착된 순</option><option value="up" ${CS === "up" ? "selected" : ""}>상승여력 순</option></select></div>`;
    let L = Z.list.filter(c => CE === "all" || c.eng[CE]);
    if (CE !== "all") L = L.slice().sort((a, b) => a.eng[CE].rank - b.eng[CE].rank);
    else if (CS === "up") L = L.slice().sort((a, b) => (b.up ?? -99) - (a.up ?? -99));
    const cls = r => r <= 3 ? "r1" : r <= 10 ? "r2" : "r3";
    h += L.map((c, i) => `<div class="cc" id="cc-${esc(c.t)}"><div class="t1" onclick="catchToggle('${esc(c.t)}')" style="cursor:pointer"><span class="rk">${i + 1}</span>
        <div><div class="tk">${c.focus ? "🎯 " : ""}${esc(c.t)}</div><div class="nm">${esc((c.name || "").slice(0, 32))}${c.pat ? " · " + esc(c.pat) : ""}</div></div>
        <div class="up2">${c.up != null ? (c.up >= 0 ? "+" : "") + c.up.toFixed(1) + "%" : "-"}<small>${c.cond ? "상승여력(급등 시)" : "상승여력"}</small></div></div>
      <div class="en">진입 <b>${usd(c.px)}</b> → 예상 <b>${c.exp ? usd(c.exp) : "-"}</b> <small>(${c.cond ? "급등 시 중앙" : "유사 사례 중앙"})</small>${c.rng ? ` <small>(범위 ${c.rng[0] >= 0 ? "+" : ""}${c.rng[0]}% ~ +${c.rng[1]}%)</small>` : ""}${c.chg != null ? ` · 오늘 <span class="${c.chg >= 0 ? "up" : "dn"}">${c.chg >= 0 ? "+" : ""}${(+c.chg).toFixed(1)}%</span>` : ""}</div>
      ${c.warn.length ? `<div class="en" style="color:#ff8f8f">⚠️ ${c.warn.map(esc).join(" · ")}</div>` : ""}
      <div class="eh"><span>포착 엔진</span><span class="dots">${[0,1,2,3,4].map(k => `<i class="${k < c.n ? "f" : ""}"></i>`).join("")} ${c.n}/5</span></div>
      <div class="eg">${EN.map(([k, ic]) => c.eng[k] ? `<div class="${cls(c.eng[k].rank)}">${ic} 포착<b>${c.eng[k].rank}위</b></div>` : Z.only && !Z.only.includes(k) ? `<div>${ic}<b style="font-size:10.5px;font-weight:400">대상외</b></div>` : `<div>${ic}<b>-</b></div>`).join("")}</div>
      <div class="cd">${catchDetail(c, CH)}${tradeBlock(DATA.items.find(x => x.t === c.t)).replace('class="tp"', 'class="tp" style="margin:0 0 6px"')}
        ${DATA.items.find(x => x.t === c.t) ? `<a class="go" href="#" onclick="openCard('${esc(c.t)}');return false">워치에서 전체 보기 →</a>` : ""}</div></div>`).join("")
      || '<div class="empty">이 기간에 포착된 종목이 없어요</div>';
    $("#list").innerHTML = h;
    return;
  }
  if (TAB === "sq"){
    const xs = DATA.sq || [];
    const sh = v => v == null ? "-" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : (v / 1e3).toFixed(0) + "K";
    $("#sub").textContent = `${DATA.updated} 업데이트 · 숏스퀴즈 점수순`;
    $("#list").innerHTML = `<div class="intro">🩳 <b>숏스퀴즈 후보</b> — 공매도가 많이 쌓였고(유통 대비 %), 빌린 주식 이자가 비싸고, 유통 물량이 적은 종목이에요. 이런 종목은 <b>거래량이 터지며 오르면</b> 공매도 세력이 손실을 줄이려 되사면서(숏커버) 급등이 커질 수 있어요.<br><span style="color:var(--muted)">공매도 수치는 거래소 보고 기준(2주마다), 대차 이자는 IBKR 기준이에요. 🔥점화 → ⚡예열 → ⏳대기 순.</span></div>`
      + (xs.map((c, i) => `<article class="cand sqc ${esc(c.lv)}"><div class="ch"><div class="rank ${i < 3 ? 'r' + (i + 1) : ''}">${i + 1}</div>
        <div><div class="tk">${TK(c.t)}</div><div class="nm">${esc((c.name || "").slice(0, 28))}</div><span class="ty">${esc(c.st)}</span></div>
        <div class="cs"><b>${c.score}</b><small>스퀴즈 점수</small></div></div>
        <div class="kp">
          ${kp("공매도 / 유통", c.si != null ? c.si.toFixed(1) + "%" : "-", `${sh(c.short)}주${c.short_prev ? ` · 전월 ${sh(c.short_prev)}` : ""}${c.si_date ? " · " + esc(c.si_date) : ""}`, c.si >= 20 ? "up" : "")}
          ${kp("대차 이자(연)", c.fee != null ? c.fee.toFixed(c.fee < 10 ? 1 : 0) + "%" : "-", c.avail != null ? `빌릴 수 있는 주식 ${c.avail <= 0 ? "없음" : sh(c.avail) + "주"}` : "정보 없음", c.fee >= 50 ? "up" : "")}
          ${kp("커버 일수", c.dtc != null ? c.dtc.toFixed(1) + "일" : "-", `유통 ${sh(c.float)}주`, c.dtc >= 3 ? "up" : "")}
        </div>
        <div class="kp">
          ${kp("현재가", usd(c.price), c.chg != null ? `<span class="${c.chg >= 0 ? 'up' : 'dn'}">${c.chg >= 0 ? "+" : ""}${c.chg.toFixed(1)}%</span>` : "")}
          ${kp("오늘 거래량", c.relvol != null ? c.relvol.toFixed(1) + "배" : "-", c.turn != null ? `유통 회전 ${(c.turn * 100).toFixed(0)}%` : "평소 대비", c.relvol >= 3 ? "up" : "")}
          ${kp("VWAP", usd(c.vwap), c.vwap ? (c.price >= c.vwap ? "위 ✅" : "아래") : "")}
        </div>
        <div class="chipsm">${c.why.map(w => `<span>${esc(w)}</span>`).join("")}${c.risk.map(r => `<span class="rk">⚠ ${esc(r)}</span>`).join("")}</div>
        ${c.trig.length ? `<div class="scn"><div><b class="s-강세">출발</b><span>${c.trig.map(esc).join(" + ")}</span></div>${c.risk.length ? `<div><b class="s-리스크">리스크</b><span>${c.risk.map(esc).join(" · ")} — 오르면 회사가 주식을 팔 수 있어 스퀴즈가 꺾일 수 있음</span></div>` : ""}</div>` : ""}
        ${tradeBlock(DATA.items.find(x => x.t === c.t))}
        <a class="go" href="#c-${esc(c.t)}" onclick="openCard('${esc(c.t)}');return false">상세 분석 보기 →</a></article>`).join("")
        || '<div class="empty">조건에 맞는 숏스퀴즈 후보가 없어요 (공매도 유통 대비 8% 이상)</div>');
    return;
  }
  if (TAB === "jb"){
    const xs = DATA.jbc || [], j = xs[0] && xs[0].jb;
    $("#sub").textContent = `${DATA.updated} 업데이트 · 30분마다 갱신`;
    $("#list").innerHTML = `<div class="intro">🎯 <b>종배 예상${j ? ` · ${esc(j.day)} 종가 → ${esc(j.next)}` : ""}</b> — 오늘 본장 흐름(등락·거래량·종가 위치)이 비슷했던 과거 5년의 다음날 결과로 계산해요. ${j && !j.done ? "장중 값이라 마감 전까지 바뀌어요. 마감 30분 전 갱신분을 보세요." : ""}</div>`
      + (xs.map(jbCard).join("") || '<div class="empty">본장 데이터가 생기면 표시돼요 (프리장 중엔 비어 있어요)</div>');
    return;
  }
  const q = $("#q").value.trim().toLowerCase(), sort = $("#sort").value;
  let xs = DATA.items.filter(it => (!q || it.t.toLowerCase().includes(q) || (it.name||"").toLowerCase().includes(q))
    && [...on].every(f => matches(it, f)));
  const sn = it => it.snap || {};
  const key = {
    total: it => -it.total, strength: it => -(it.strength*100 + it.total), stage: it => -(it.stage*100 + it.total),
    runway: it => it.runway == null ? 1e9 : it.runway, dday: it => { const d = nearest(it); return d ? d.d : 1e9; },
    upside: it => -upside(it), rsi: it => sn(it).rsi == null ? 1e9 : sn(it).rsi,
    ai: it => -((it.ai_view && it.ai_view.score) ?? -1),
    regp: it => -((it.prob && it.prob.reg) ?? -1), prep: it => -((it.prob && it.prob.pre) ?? -1),
    relvol: it => -(sn(it).relvol || 0), chg: it => -(sn(it).chg == null ? -1e9 : sn(it).chg)
  }[sort];
  xs.sort((a,b) => key(a) - key(b));
  $("#sub").textContent = `${DATA.updated} 업데이트 · ${xs.length}/${DATA.items.length}종목 · 카드를 누르면 상세`;
  const miss = q && !xs.length ? `<div class="empty">'${esc(q.toUpperCase())}'은(는) 목록에 없어요.<br>텔레그램에서 <b>/add ${esc(q.toUpperCase())}</b> 를 보내면<br>다음 업데이트부터 ⭐관심종목으로 포함돼요.</div>` : "";
  HOTON = !q && !on.size && sort !== "chg";
  $("#list").innerHTML = '<div id="hotbox"></div>' + (xs.map(card).join("") || miss || '<div class="empty">조건에 맞는 종목이 없어요</div>');
  renderHot();
}
$("#chips").innerHTML = FILTERS.map(f => `<span class="chip" data-f="${f}">${f}</span>`).join("");
$("#chips").addEventListener("click", e => {
  const f = e.target.dataset.f; if (!f) return;
  on.has(f) ? on.delete(f) : on.add(f); e.target.classList.toggle("on"); render();
});
$("#tabs").addEventListener("click", e => { const v = e.target.dataset.v; if (!v) return; TAB = v; syncTabs(); render(); window.scrollTo(0, 0); });
syncTabs();
$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
render();
</script>
</body>
</html>
